<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="yangzhe 的个人导航页">
<title>导航</title>
<link rel="shortcut icon" type="image/x-icon" href="./img/云谷内网.png">
<style>
  :root {
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 22px;
    --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  [data-theme="dark"] {
    --bg-base: #0b1020;
    --bg-gradient:
      radial-gradient(ellipse at 12% 8%, rgba(76, 29, 149, 0.30) 0%, transparent 55%),
      radial-gradient(ellipse at 88% 12%, rgba(30, 58, 138, 0.28) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 92%, rgba(131, 24, 67, 0.22) 0%, transparent 55%);
    --blob-1: #4c1d95;
    --blob-2: #1e3a8a;
    --blob-3: #831843;
    --blob-4: #134e4a;
    --blob-opacity: 0.55;
    --glass-bg: rgba(20, 27, 50, 0.42);
    --glass-bg-strong: rgba(20, 27, 50, 0.62);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-border-hover: rgba(255, 255, 255, 0.18);
    --text-1: #f1f5f9;
    --text-2: #94a3b8;
    --text-3: #64748b;
    --accent: #818cf8;
    --accent-soft: rgba(129, 140, 248, 0.18);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    --shadow-hover: 0 16px 50px rgba(0, 0, 0, 0.5);
    --avatar-shadow: rgba(0, 0, 0, 0.3);
  }

  [data-theme="light"] {
    --bg-base: #f5f3ff;
    --bg-gradient:
      radial-gradient(ellipse at 0% 0%, rgba(196, 181, 253, 0.55) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(147, 197, 253, 0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(251, 207, 232, 0.5) 0%, transparent 55%),
      radial-gradient(ellipse at 0% 100%, rgba(153, 246, 228, 0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(254, 240, 138, 0.18) 0%, transparent 70%);
    --blob-1: #c4b5fd;
    --blob-2: #93c5fd;
    --blob-3: #fbcfe8;
    --blob-4: #99f6e4;
    --blob-opacity: 0.7;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-bg-strong: rgba(255, 255, 255, 0.78);
    --glass-border: rgba(255, 255, 255, 0.7);
    --glass-border-hover: rgba(99, 102, 241, 0.35);
    --text-1: #1e293b;
    --text-2: #475569;
    --text-3: #94a3b8;
    --accent: #6366f1;
    --accent-soft: rgba(99, 102, 241, 0.12);
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    --shadow-hover: 0 16px 40px rgba(15, 23, 42, 0.14);
    --avatar-shadow: rgba(15, 23, 42, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: var(--font-sans);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color var(--transition), color var(--transition);
  }

  body {
    overflow-x: hidden;
    background-color: var(--bg-base);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    background-size: cover;
  }

  /* 背景毛玻璃需要的彩色色块 */
  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-blobs::before,
  .bg-blobs::after,
  .bg-blobs > span {
    content: "";
    position: absolute;
    width: 50vmax;
    height: 50vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: var(--blob-opacity);
    will-change: transform;
  }
  .bg-blobs::before {
    background: var(--blob-1);
    top: -15vmax; left: -10vmax;
    animation: float1 22s ease-in-out infinite;
  }
  .bg-blobs::after {
    background: var(--blob-2);
    bottom: -20vmax; right: -10vmax;
    animation: float2 26s ease-in-out infinite;
  }
  .bg-blobs > span:nth-child(1) {
    background: var(--blob-3);
    top: 30vh; right: 15vw;
    width: 35vmax; height: 35vmax;
    animation: float3 30s ease-in-out infinite;
  }
  .bg-blobs > span:nth-child(2) {
    background: var(--blob-4);
    bottom: 10vh; left: 25vw;
    width: 30vmax; height: 30vmax;
    animation: float1 28s ease-in-out infinite reverse;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(8vw, 6vh) scale(1.08); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-7vw, -5vh) scale(0.95); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-5vw, 4vh) scale(1.1); }
  }

  /* 顶栏 */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 28px;
    padding-top: max(14px, env(safe-area-inset-top));
    padding-left: max(28px, env(safe-area-inset-left));
    padding-right: max(28px, env(safe-area-inset-right));
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--glass-border);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-1);
    font-weight: 600;
    font-size: 16px;
  }
  .logo img {
    width: 30px;
    height: 30px;
    border-radius: 8px;
  }
  .topbar-spacer { flex: 1; }

  .icon-btn {
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    color: var(--text-1);
    border-radius: 10px;
    cursor: pointer;
    transition: var(--transition);
  }
  .icon-btn:hover {
    border-color: var(--glass-border-hover);
    transform: translateY(-1px);
  }
  .icon-btn svg { width: 18px; height: 18px; }

  /* 搜索弹框 */
  .search-modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  .search-modal[hidden] { display: none; }
  .search-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(8, 12, 28, 0.32);
    backdrop-filter: blur(6px) saturate(140%);
    -webkit-backdrop-filter: blur(6px) saturate(140%);
    pointer-events: auto;
    animation: fadeIn 180ms ease-out;
  }
  [data-theme="light"] .search-modal-backdrop {
    background: rgba(15, 23, 42, 0.18);
  }
  .search-modal-panel {
    position: relative;
    margin-top: 14vh;
    pointer-events: auto;
    animation: slideDown 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(680px, 92vw);
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .search-modal-hint {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--text-2);
    background: var(--glass-bg-strong);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 6px 14px;
    transition: opacity 180ms ease-out, transform 180ms ease-out;
  }
  .search-modal-panel:has(.engine-popover.open) .search-modal-hint {
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
  }
  .search-modal-hint kbd {
    background: var(--accent-soft);
    border: 1px solid var(--glass-border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: var(--font-sans);
    font-size: 11px;
    margin: 0 2px;
    color: var(--text-1);
  }

  .search {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
    box-shadow: var(--shadow-hover);
    transition: var(--transition);
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-hover);
  }
  .engine-btn {
    background: transparent;
    border: 0;
    color: var(--text-1);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    transition: var(--transition);
  }
  .engine-btn:hover { background: var(--accent-soft); }
  .engine-btn svg { width: 14px; height: 14px; opacity: 0.6; }
  .engine-divider {
    width: 1px;
    height: 22px;
    background: var(--glass-border);
    margin: 0 4px;
  }
  .search-input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text-1);
    font-size: 15px;
    padding: 10px 12px;
    min-width: 0;
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-submit {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }
  .search-submit:hover { transform: scale(1.05); }
  .search-submit svg { width: 16px; height: 16px; }

  .engine-popover {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 320px;
    max-width: 420px;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 8px;
    box-shadow: var(--shadow-hover);
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    z-index: 60;
  }
  .engine-popover.open { display: grid; }
  .engine-popover button {
    background: transparent;
    border: 0;
    color: var(--text-1);
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: var(--transition);
  }
  .engine-popover button:hover { background: var(--accent-soft); }
  .engine-popover button.active {
    background: var(--accent);
    color: white;
  }

  /* 主体 */
  main {
    max-width: 1800px;
    margin: 0 auto;
    padding: 28px clamp(16px, 2.4vw, 48px) 80px;
  }
  .category {
    margin-bottom: 28px;
  }
  .category-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .category-title::before {
    content: "";
    width: 3px;
    height: 13px;
    background: var(--accent);
    border-radius: 2px;
  }
  .category-count {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--glass-bg);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    text-decoration: none;
    color: var(--text-1);
    cursor: pointer;
    transition: var(--transition);
    overflow: hidden;
    min-width: 0;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-soft), transparent 60%);
    opacity: 0;
    transition: var(--transition);
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--glass-border-hover);
    box-shadow: var(--shadow-hover);
    background: var(--glass-bg-strong);
  }
  .card:hover::before { opacity: 1; }

  .card-icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 9px;
  }
  .card-icon.letter {
    color: white;
    font-weight: 600;
    font-size: 19px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
  }
  .card-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .card-title {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-desc {
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-url {
    font-size: 11px;
    color: var(--text-3);
    line-height: 1.3;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }
  .card-action {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    transition: var(--transition);
    background: transparent;
    border: 0;
    cursor: pointer;
    opacity: 0;
  }
  .card:hover .card-action { color: var(--accent); opacity: 1; }
  .card-action svg { width: 13px; height: 13px; }

  /* 空状态 */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-3);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 18px;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    color: var(--text-1);
    font-size: 13px;
    box-shadow: var(--shadow-hover);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition), transform var(--transition);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast svg { width: 16px; height: 16px; color: #10b981; }

  /* 回到顶部 */
  .to-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition), transform var(--transition);
    transform: translateY(10px);
  }
  .to-top.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  @media (max-width: 640px) {
    .topbar {
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    main { padding: 16px 12px 60px; }
    .search-modal-panel { margin-top: 10vh; width: min(680px, 94vw); }
    .engine-popover {
      grid-template-columns: repeat(3, 1fr);
      min-width: 0;
      width: 100%;
      max-width: none;
    }
    .search-modal-hint { font-size: 11px; padding: 5px 12px; }
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .card { padding: 8px 10px; gap: 10px; }
    .card-icon { width: 34px; height: 34px; }
    .card-icon.letter { font-size: 15px; }
    .card-title { font-size: 13px; }
    .card-desc { font-size: 11px; }
    .card-url { font-size: 10px; }
    .logo span { display: none; }
    .to-top { bottom: max(20px, env(safe-area-inset-bottom)); right: 16px; }
    .toast { bottom: max(24px, env(safe-area-inset-bottom)); }
  }

  /* 触屏设备：卡片右侧操作图标始终可见，并去掉悬停的位移防止粘连 */
  @media (hover: none) {
    .card-action { opacity: 0.55; }
    .card:hover { transform: none; }
    .card:hover .card-action { opacity: 1; }
  }

  /* 偏好减少动效：关掉背景色块漂浮动画 */
  @media (prefers-reduced-motion: reduce) {
    .bg-blobs::before,
    .bg-blobs::after,
    .bg-blobs > span { animation: none; }
  }
</style>
</head>
<body>

<div class="bg-blobs"><span></span><span></span></div>

<header class="topbar">
  <a class="logo" href="./">
    <img src="./img/云谷内网.png" alt="logo">
    <span>导航</span>
  </a>
  <div class="topbar-spacer"></div>
  <button class="icon-btn" id="search-trigger" title="搜索（按 /）" aria-label="搜索">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
  </button>
  <button class="icon-btn" id="theme-toggle" title="切换深浅主题" aria-label="切换主题">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
  </button>
</header>

<main id="content"></main>

<div class="search-modal" id="search-modal" hidden>
  <div class="search-modal-backdrop" id="search-modal-backdrop"></div>
  <div class="search-modal-panel">
    <div class="search">
      <button class="engine-btn" id="engine-btn" type="button">
        <span id="engine-name">谷歌</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <span class="engine-divider"></span>
      <input class="search-input" id="search-input" type="text" placeholder="搜索本页书签，或回车跳转搜索引擎" autocomplete="off">
      <button class="search-submit" id="search-submit" type="button" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </button>
      <div class="engine-popover" id="engine-popover"></div>
    </div>
    <div class="search-modal-hint">
      <kbd>Esc</kbd> 关闭 · <kbd>Enter</kbd> 用所选引擎搜索 · 输入即时过滤本页书签
    </div>
  </div>
</div>

<button class="icon-btn to-top" id="to-top" title="回到顶部" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-text">已复制</span>
</div>

<script>
  // ============== 数据：所有书签和搜索引擎 ==============
  const bookmarks = [
    {
      id: 'tools',
      title: '常用工具',
      items: [
        // { title: 'NextChat',       desc: 'AI 对话',         url: 'https://chat.auyunn.cn/' },
        // { title: 'TDChat',         desc: 'TDChat 在线版',    url: 'https://tdchatvip.us/' },
        // { title: '华为云',          desc: 'Huawei Cloud',    url: 'https://www.huaweicloud.com/' },
        // { title: 'linux.do 导航',   desc: 'linuxdo nav',     url: 'https://nav.linux.do/', icon: './img/linuxdo.png' },

         { title: 'ChatGPT',            desc: 'ChatGPT',          url: 'https://chatgpt.com/', icon: './img/gpt.png'},

        { title: '群晖',       desc: 'Sakura的群晖',            url: 'https://frp-toe.com:13607/',          icon: './img/存储-群晖.png' },
        { title: '群晖',       desc: 'quickconnect 群晖',    url: 'https://yangzhe.cn6.quickconnect.cn/', icon: './img/存储-群晖.png' },
        // { title: '百度云盘',    desc: '群晖的百度云盘',         url: 'http://1.94.219.103:18092/',          icon: './img/baiduwangpan.png' },
        { title: '5700x 地址',     desc: '点击复制 frp 地址', copy: 'frp-rug.com:30635' },
        { title: 'win10tlsc21',   desc: '点击复制 frp 地址', copy: 'frp-hip.com:15672' },

    {

        { title: 'AX-3600',     desc: '内网的小米路由器',         url: 'http://192.168.31.1/',          icon: './img/路由器.png' },

        { title: 'OpenWrt的监控面板',     desc: 'OpenWrt的监控面板',         url: 'http://192.168.1.110:19999/',          icon: './img/jiankong.ico' },

    },
    {
      id: 'fun',
      title: '休闲娱乐',
      items: [
        { title: '虎牙直播',  desc: '虎牙 LPL',  url: 'https://www.huya.com/lpl',    icon: './img/虎牙直播.png' },
        { title: 'YouTube', desc: 'YouTube',  url: 'https://www.youtube.com/',   icon: './img/youtube.png' },
        { title: 'bilibili', desc: 'B 站',     url: 'https://www.bilibili.com/',  icon: './img/bilibili.png' },
        { title: 'V2EX',    desc: 'V2EX',     url: 'https://www.v2ex.com/',      icon: './img/v2ex.png' },
        { title: 'linux.do', desc: 'linux.do', url: 'https://linux.do/',         icon: './img/linuxdo.png' },
        { title: '36kr', desc: '36氪', url: 'https://36kr.com/',         icon: './img/36kr.png' },
        { title: 'CCTV在线直播', desc: 'CCTV在线直播', url: 'https://tv.cctv.com/live/',         icon: './img/cctv.png' },
        { title: '北京卫视', desc: '北京卫视', url: 'https://www.btime.com/btv/btvsy_index',         icon: './img/beijing.png' },
        { title: '影视导航', desc: '影视导航', url: 'https://yang-1989.eu.org/',         icon: './img/dianshi.png' },
      ],
    },
  ];

  const engines = [
    { name: '谷歌',     url: 'https://www.google.com/search?q=' },
    { name: '必应',     url: 'https://cn.bing.com/search?q=' },
    { name: '百度',     url: 'https://www.baidu.com/s?wd=' },
    { name: 'Yandex',  url: 'https://yandex.com/search/?text=' },
    { name: 'GitHub',  url: 'https://github.com/search?q=' },
    { name: '知乎',     url: 'https://www.zhihu.com/search?type=content&q=' },
    { name: 'V2EX',    url: 'https://www.google.com/search?q=site%3Av2ex.com+' },
    { name: 'Bilibili', url: 'http://search.bilibili.com/all?keyword=' },
    { name: '豆瓣',     url: 'https://www.douban.com/search?q=' },
    { name: '微博',     url: 'https://s.weibo.com/weibo/' },
    { name: '淘宝',     url: 'https://s.taobao.com/search?q=' },
    { name: '京东',     url: 'http://search.jd.com/Search?keyword=' },
  ];

  // ============== 工具函数 ==============
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // 字母头像配色（按字符串哈希挑色）
  const palette = [
    ['#6366f1', '#8b5cf6'],
    ['#0ea5e9', '#22d3ee'],
    ['#10b981', '#34d399'],
    ['#f59e0b', '#fbbf24'],
    ['#ec4899', '#f472b6'],
    ['#ef4444', '#f87171'],
    ['#14b8a6', '#5eead4'],
    ['#8b5cf6', '#c084fc'],
  ];
  function pickColor(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return palette[h % palette.length];
  }
  function letterIcon(title) {
    const ch = (title || '?').trim().charAt(0).toUpperCase();
    const [c1, c2] = pickColor(title || '');
    return `<div class="card-icon letter" style="background:linear-gradient(135deg,${c1},${c2})">${escapeHtml(ch)}</div>`;
  }
  function imgIcon(src, alt) {
    return `<div class="card-icon" data-fallback="${escapeHtml(alt)}"><img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy"></div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function hostOf(url) {
    try { return new URL(url).host; } catch (e) { return url; }
  }

  // ============== 渲染 ==============
  const externalSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  const copySvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  function renderContent() {
    const main = $('#content');
    main.innerHTML = bookmarks.map((cat) => `
      <section class="category" id="cat-${cat.id}" data-id="${cat.id}">
        <h2 class="category-title">
          ${escapeHtml(cat.title)}
          <span class="category-count">${cat.items.length}</span>
        </h2>
        <div class="card-grid">
          ${cat.items.map((it) => renderCard(it)).join('')}
        </div>
      </section>
    `).join('');

    // 给所有 copy 卡片绑定复制
    $$('.card[data-copy]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        copyText(el.dataset.copy);
      });
    });

    // 图片加载失败时回退到字母头像
    $$('.card-icon img').forEach((img) => {
      img.addEventListener('error', () => {
        const wrap = img.parentElement;
        if (!wrap) return;
        const fallback = wrap.dataset.fallback || img.alt || '?';
        wrap.outerHTML = letterIcon(fallback);
      }, { once: true });
    });
  }

  function renderCard(item) {
    const icon = item.icon ? imgIcon(item.icon, item.title) : letterIcon(item.title);
    const title = escapeHtml(item.title);
    const desc = item.desc ? `<div class="card-desc">${escapeHtml(item.desc)}</div>` : '';
    const sub = item.copy
      ? `<div class="card-url">${escapeHtml(item.copy)}</div>`
      : (item.url ? `<div class="card-url">${escapeHtml(hostOf(item.url))}</div>` : '');
    const haystack = escapeHtml(((item.title || '') + ' ' + (item.desc || '') + ' ' + (item.url || item.copy || '')).toLowerCase());

    if (item.copy) {
      return `<a class="card" data-copy="${escapeHtml(item.copy)}" data-search="${haystack}" href="javascript:void(0)">
        ${icon}
        <div class="card-text">
          <div class="card-title">${title}</div>
          ${desc}
          ${sub}
        </div>
        <span class="card-action" title="复制">${copySvg}</span>
      </a>`;
    }
    return `<a class="card" href="${escapeHtml(item.url)}" target="_blank" rel="noopener" data-search="${haystack}">
      ${icon}
      <div class="card-text">
        <div class="card-title">${title}</div>
        ${desc}
        ${sub}
      </div>
      <span class="card-action" title="打开">${externalSvg}</span>
    </a>`;
  }

  function renderEngines() {
    const pop = $('#engine-popover');
    pop.innerHTML = engines.map((e, i) =>
      `<button type="button" data-index="${i}">${escapeHtml(e.name)}</button>`
    ).join('');
    pop.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        setEngine(parseInt(btn.dataset.index, 10));
        pop.classList.remove('open');
      });
    });
  }

  // ============== 搜索引擎 ==============
  let currentEngine = 0;
  function setEngine(i) {
    currentEngine = i;
    $('#engine-name').textContent = engines[i].name;
    $$('#engine-popover button').forEach((b, j) => b.classList.toggle('active', j === i));
    localStorage.setItem('engine', String(i));
  }
  function loadEngine() {
    const saved = parseInt(localStorage.getItem('engine') || '0', 10);
    setEngine(Number.isFinite(saved) && engines[saved] ? saved : 0);
  }
  function doSearch() {
    const q = $('#search-input').value.trim();
    if (!q) return;
    window.open(engines[currentEngine].url + encodeURIComponent(q), '_blank', 'noopener');
    closeSearchModal();
  }

  // ============== 搜索弹框 ==============
  function openSearchModal() {
    const modal = $('#search-modal');
    if (!modal.hasAttribute('hidden')) return;
    modal.removeAttribute('hidden');
    setTimeout(() => $('#search-input').focus(), 30);
  }
  function closeSearchModal() {
    const modal = $('#search-modal');
    if (modal.hasAttribute('hidden')) return;
    modal.setAttribute('hidden', '');
    const input = $('#search-input');
    if (input.value) {
      input.value = '';
      filterBookmarks('');
    }
    $('#engine-popover').classList.remove('open');
  }
  function isSearchModalOpen() {
    return !$('#search-modal').hasAttribute('hidden');
  }

  // ============== 本地过滤 ==============
  function filterBookmarks(q) {
    const query = q.trim().toLowerCase();
    let total = 0, matched = 0;
    $$('section.category').forEach((sec) => {
      let visibleInCat = 0;
      sec.querySelectorAll('.card').forEach((card) => {
        total++;
        const ok = !query || card.dataset.search.includes(query);
        card.style.display = ok ? '' : 'none';
        if (ok) { visibleInCat++; matched++; }
      });
      sec.style.display = visibleInCat ? '' : 'none';
    });
    // 空状态
    let empty = $('#empty-state');
    if (query && matched === 0) {
      if (!empty) {
        empty = document.createElement('div');
        empty.id = 'empty-state';
        empty.className = 'empty';
        empty.innerHTML = `没有匹配 "<strong></strong>" 的书签<br><small>回车可用「${engines[currentEngine].name}」搜索</small>`;
        $('#content').appendChild(empty);
      }
      empty.querySelector('strong').textContent = q;
      empty.style.display = '';
    } else if (empty) {
      empty.style.display = 'none';
    }
  }

  // ============== 复制 ==============
  function copyText(text) {
    const ok = (t) => showToast(`已复制：${t}`);
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).then(() => ok(text)).catch(() => fallback(text, ok));
    } else {
      fallback(text, ok);
    }
  }
  function fallback(text, ok) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); ok(text); } finally { ta.remove(); }
  }

  // ============== Toast ==============
  let toastTimer;
  function showToast(text) {
    const t = $('#toast');
    $('#toast-text').textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ============== 主题 ==============
  const sunSvg = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  const moonSvg = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    $('#theme-icon').innerHTML = theme === 'dark' ? sunSvg : moonSvg;
    localStorage.setItem('theme', theme);
  }
  function initTheme() {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') return applyTheme(saved);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }

  // ============== 回到顶部 ==============
  function setupToTop() {
    const btn = $('#to-top');
    window.addEventListener('scroll', () => {
      btn.classList.toggle('show', window.scrollY > 400);
    }, { passive: true });
    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }

  // ============== 初始化 ==============
  document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    renderEngines();
    loadEngine();
    renderContent();
    setupToTop();

    $('#theme-toggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    });

    $('#search-trigger').addEventListener('click', openSearchModal);
    $('#search-modal-backdrop').addEventListener('click', closeSearchModal);

    $('#engine-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      $('#engine-popover').classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search')) $('#engine-popover').classList.remove('open');
    });

    const input = $('#search-input');
    input.addEventListener('input', () => filterBookmarks(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
      else if (e.key === 'Escape') {
        e.preventDefault();
        if (input.value) {
          input.value = '';
          filterBookmarks('');
        } else {
          closeSearchModal();
        }
      }
    });
    $('#search-submit').addEventListener('click', doSearch);

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const isTyping = tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === '/' && !isTyping) {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape' && isSearchModalOpen() && !isTyping) {
        closeSearchModal();
      }
    });
  });
</script>
